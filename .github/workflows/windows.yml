name: Windows

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Verify bundled runtime and models
        shell: pwsh
        run: |
          $required = @(
            "onnxruntime.dll",
            "assets/ocr/ch_PP-OCRv4_det_infer.onnx",
            "assets/ocr/ch_PP-OCRv4_rec_infer.onnx",
            "assets/ocr/ppocr_keys_v4.txt",
            "assets/ocr/pp-lcnet_x0_25_textline_ori.onnx"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing distribution asset: $path" }
          }

      - name: Format
        run: cargo fmt --all -- --check

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenTranslator-win64
          path: dist/*.zip

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
